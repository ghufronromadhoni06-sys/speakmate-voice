<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghufron's SpeakMate AI — Voice Engine</title>
<style>
:root{--navy:#10213d;--blue:#2563eb;--muted:#64748b;--line:#e5eaf2}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f7f9fd;color:#172033}
.wrap{max-width:680px;margin:auto;background:white;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.mic{font-size:34px;margin:4px}
h2{font-size:18px;margin:8px 0}
p{font-size:13px;color:var(--muted);line-height:1.5}
button{border:0;border-radius:11px;padding:12px 18px;background:var(--blue);color:white;font-weight:600;cursor:pointer}
button.stop{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
button:disabled{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:110px;margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:11px;font:14px/1.5 Arial;resize:vertical}
.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:10px}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.secondary{background:#edf2fa;color:#253a5a}
</style>
</head>
<body>
<div class="wrap">
  <div class="mic">🎙️</div>
  <h2>Ghufron's SpeakMate AI</h2>
  <p>Ucapkan kalimat dalam bahasa Indonesia. Teks yang dikenali akan dikirim kembali ke Ghufron's SpeakMate AI.</p>
  <button id="start" onclick="startListening()">Mulai berbicara</button>
  <button id="stop" class="stop" onclick="stopListening()" disabled>Stop</button>
  <textarea id="transcript" placeholder="Hasil pengenalan suara akan muncul di sini..." readonly></textarea>
  <div class="status" id="status">Tekan Mulai berbicara dan izinkan akses mikrofon.</div>
  <div class="actions">
    <button class="secondary" onclick="sendText()">Kirim teks ke SpeakMate</button>
    <button class="secondary" onclick="clearText()">Hapus</button>
  </div>
</div>
<script>
let recognition=null;
let listening=false;
let finalText='';

function sendToParent(type, text) {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({source:'speakmate-voice-engine',type:type,text:text}, '*');
  } else if (window.opener && !window.opener.closed) {
    window.opener.postMessage({source:'speakmate-voice-engine',type:type,text:text}, '*');
  }
}
function startListening(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('status').textContent='Browser ini belum mendukung Web Speech API. Coba Google Chrome terbaru.';
    return;
  }
  if(listening)return;
  recognition=new SR();
  recognition.lang='id-ID';
  recognition.continuous=true;
  recognition.interimResults=true;
  finalText='';
  document.getElementById('transcript').value='';
  recognition.onstart=()=>{
    listening=true;
    document.getElementById('start').disabled=true;
    document.getElementById('stop').disabled=false;
    document.getElementById('status').textContent='Mendengarkan... Silakan berbicara.';
  };
  recognition.onresult=(event)=>{
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const phrase=event.results[i][0].transcript;
      if(event.results[i].isFinal) {
        finalText += phrase + ' ';
        sendToParent('segment', phrase);
      } else {
        interim += phrase;
      }
    }
    document.getElementById('transcript').value=(finalText+interim).trim();
  };
  recognition.onerror=(event)=>{
    document.getElementById('status').textContent='Pengenalan suara gagal: '+event.error+'. Periksa izin mikrofon dan coba lagi.';
  };
  recognition.onend=()=>{
    listening=false;
    document.getElementById('start').disabled=false;
    document.getElementById('stop').disabled=true;
    document.getElementById('status').textContent='Selesai. Periksa teks, lalu kirim ke SpeakMate.';
    if(finalText.trim()) sendToParent('final',finalText.trim());
  };
  try{recognition.start();}
  catch(e){document.getElementById('status').textContent='Tidak dapat memulai mikrofon: '+e.message;}
}
function stopListening(){if(recognition&&listening)recognition.stop();}
function sendText(){
  const text=document.getElementById('transcript').value.trim();
  if(!text){document.getElementById('status').textContent='Belum ada teks untuk dikirim.';return;}
  sendToParent('final',text);
  document.getElementById('status').textContent='Teks dikirim ke SpeakMate AI.';
}
function clearText(){finalText='';document.getElementById('transcript').value='';document.getElementById('status').textContent='Teks dihapus.';}
</script>
</body>
</html>
